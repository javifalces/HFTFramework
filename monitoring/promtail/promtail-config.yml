server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Docker container logs ────────────────────────────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: logstream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      # app = docker-compose service name; used by Grafana hft-logs dashboard
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: app
    pipeline_stages:
      # Extract log level from common Java/logback log line formats, e.g.:
      #   2024-01-01 00:00:00 INFO  c.j.hft... - message
      #   [2024-01-01T00:00:00] [ERROR] thread - message
      - regex:
          expression: '(?i)(?P<level>TRACE|DEBUG|INFO|WARN(?:ING)?|ERROR|FATAL|SEVERE)'
      - labels:
          level:

  # ── Host system logs (optional) ──────────────────────────────────────────────
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log
